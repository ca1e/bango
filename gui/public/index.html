<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋 · Gomocup 协议对弈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c9973f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo-stone"></span>
    <h1>五子棋 <em>Gomocup 协议对弈</em></h1>
  </div>
  <div class="engine-state">
    <span class="dot off" id="stateDot"></span>
    <span id="stateText">未连接</span>
    <span class="engine-name" id="engineName"></span>
  </div>
</header>

<main>
  <section class="board-wrap">
    <canvas id="board"></canvas>
  </section>

  <aside class="panel">
    <section class="card">
      <div class="turn-line">
        <span class="mini-stone" id="turnStone"></span>
        <span id="turnText">准备开始</span>
        <span class="thinking" id="thinkingTag" hidden>AI 思考中<span class="dots"><i></i><i></i><i></i></span></span>
      </div>
      <div class="side-line" id="sideText"></div>
      <div class="actions">
        <button id="startBtn" class="primary">开始对局</button>
        <button id="stopBtn" hidden>停止对局</button>
        <button id="undoBtn" disabled>悔棋</button>
      </div>
    </section>

    <section class="card">
      <h2>对局设置</h2>
      <div class="field">
        <label>先手</label>
        <div class="seg" id="segFirst">
          <button data-v="player" class="on">玩家（黑）</button>
          <button data-v="ai">AI（黑）</button>
        </div>
      </div>
      <div class="field">
        <label>禁手规则</label>
        <div class="seg" id="segRule">
          <button data-v="free" class="on">无禁手</button>
          <button data-v="renju">有禁手 · 连珠</button>
        </div>
      </div>
      <div class="field">
        <label>棋盘</label>
        <div class="seg" id="segSize">
          <button data-v="15" class="on">15 路</button>
          <button data-v="20">20 路</button>
        </div>
      </div>
      <div class="field">
        <label>引擎地址</label>
        <input id="engineAddr" value="127.0.0.1:9527" spellcheck="false" autocomplete="off">
      </div>
      <p class="hint" id="settingsHint" hidden>对局进行中，设置将在重新开始后生效</p>
    </section>

    <section class="card grow">
      <h2>落子记录</h2>
      <ol id="moveList" class="moves"></ol>
    </section>

    <section class="card">
      <details class="logbox">
        <summary>协议日志 <span class="count" id="logCount">0</span></summary>
        <pre id="log"></pre>
      </details>
    </section>
  </aside>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="result-card">
    <div class="result-icon" id="resultIcon">🏆</div>
    <h2 id="resultTitle">黑方获胜</h2>
    <p id="resultReason">五连达成</p>
    <div class="result-actions">
      <button id="againBtn" class="primary">再来一局</button>
      <button id="viewBtn">查看棋盘</button>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
